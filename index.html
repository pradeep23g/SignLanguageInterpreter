<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SignSense AI - Experimental HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #00f0ff;
            --alert-neon: #ff003c;
            --bg-dark: #050b14;
            --panel-bg: rgba(0, 20, 40, 0.6);
        }

        body { 
            background-color: var(--bg-dark);
            /* Experimental Grid Background */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--primary-neon); 
            font-family: 'Share Tech Mono', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            padding-top: 30px;
            height: 100vh;
            box-sizing: border-box;
        }
        
        h1 { 
            margin: 0 0 10px 0; 
            font-size: 2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--primary-neon);
        }

        #status-banner { 
            font-size: 1rem; 
            margin-bottom: 30px; 
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .blinking-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-neon);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }

        /* HUD Video Container with Corner Brackets */
        #video-container { 
            position: relative; 
            width: 640px;
            height: 480px;
            background: #000;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        }
        
        /* The Sci-Fi Brackets */
        #video-container::before, #video-container::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        #video-container::before {
            border-top: 4px solid var(--primary-neon); border-bottom: 4px solid var(--primary-neon);
            transform: scaleX(0.95);
        }
        #video-container::after {
            border-left: 4px solid var(--primary-neon); border-right: 4px solid var(--primary-neon);
            transform: scaleY(0.95);
        }

        video, canvas { 
            position: absolute; 
            top: 0; left: 0; 
            transform: scaleX(-1); 
            width: 100%; height: 100%;
            filter: contrast(1.1) brightness(0.9);
        }
        
        /* Experimental Terminal Output */
        #chat-container {
            width: 600px;
            height: 180px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-left: 4px solid var(--primary-neon);
            margin-top: 30px;
            padding: 20px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .chat-bubble {
            color: white;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: typeIn 0.2s ease-out forwards;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .chat-bubble::before {
            content: '> TRANSLATION: ';
            color: var(--primary-neon);
            font-size: 1.2rem;
        }

        @keyframes typeIn {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <h1>[ SIGNSENSE_VISION_NODE ]</h1>
    <div id="status-banner">
        <div class="blinking-dot" id="status-dot"></div>
        <span id="status-text">INITIALIZING TENSORFLOW ENGINE...</span>
    </div>

    <div id="video-container">
        <video id="input_video"></video>
        <canvas id="output_canvas"></canvas>
    </div>
    
    <div id="chat-container"></div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const chatContainer = document.getElementById('chat-container');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        
        let lastPrediction = "";
        let predictionTimeout;

        // 1. WebSocket Setup
        const socket = new WebSocket('ws://127.0.0.1:8000/ws');
        
        socket.onopen = () => {
            statusText.innerText = "LSTM WEBSOCKET: CONNECTED & TRACKING";
            statusDot.style.backgroundColor = "var(--primary-neon)";
        };

        socket.onclose = () => {
            statusText.innerText = "CRITICAL ERROR: WEBSOCKET DISCONNECTED";
            statusText.style.color = "var(--alert-neon)";
            statusDot.style.backgroundColor = "var(--alert-neon)";
        };

        // 2. Telemetry UI & Voice synthesis
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if(data.prediction && data.prediction !== lastPrediction) {
                lastPrediction = data.prediction;
                
                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerText = data.prediction;
                chatContainer.appendChild(bubble);
                
                // Keep only the last 3 translations visible to look like a rolling log
                if (chatContainer.children.length > 3) {
                    chatContainer.removeChild(chatContainer.firstChild);
                }

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(data.prediction);
                // Experimental touch: lower the pitch slightly to sound like an AI
                utterance.pitch = 0.8; 
                window.speechSynthesis.speak(utterance);

                clearTimeout(predictionTimeout);
                predictionTimeout = setTimeout(() => { lastPrediction = ""; }, 3000);
            }
        };

        // 3. MediaPipe Hands Setup
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({ 
            maxNumHands: 2, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5 
        });

        // 4. Processing Loop
        hands.onResults((results) => {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            let allLandmarks = new Array(126).fill(0); 

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    if (index < 2) { 
                        // Sci-Fi skeleton colors
                        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00f0ff', lineWidth: 2});
                        drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2});
                        
                        const coords = landmarks.map(l => [l.x, l.y, l.z]).flat();
                        allLandmarks.splice(index * 63, 63, ...coords);
                    }
                });
            }

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({landmarks: allLandmarks}));
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();
    </script>
</body>
</html>
